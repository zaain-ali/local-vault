# GoReleaser config — https://goreleaser.com
# Builds the `lv` CLI and publishes binaries to GitHub Releases on each tag.
version: 2

project_name: local-vault

before:
  hooks:
    - go mod tidy

builds:
  - id: lv
    binary: lv
    main: ./apps/cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      # Injected at release time from the workflow (prod vs develop SERVER_URL).
      - -X github.com/zain-23/local-vault/apps/cli/internal/appstate.defaultServerURL={{ .Env.SERVER_URL }}

archives:
  - id: lv
    # No version in the name so `releases/latest/download/...` URLs are stable.
    name_template: "lv_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: zaain-ali
    name: local-vault
  # Tags like v1.2.3-dev.1 are marked as GitHub prereleases automatically.
  prerelease: auto
